server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sisvet-backend

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=SisVetDB;integratedSecurity=true;encrypt=true;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

jwt:
  secret: 5A7134743777217A25432A462D4A614E645267556B58703273357638792F423F
  expiration: 86400000

apisperu:
  base-url: https://api.apis.net.pe
  token: Bearer apis-token-1.aTSI1U7KEuT-6bbbCguH-4Y8TI6KS73N

feign:
  client:
    config:
      reniec-client:
        connect-timeout: 5000
        read-timeout: 10000

sisvet:
  rabbitmq:
    exchange: sisvet.audit.exchange
    queue: sisvet.audit.queue
    routing-key: sisvet.audit.key
  upload:
    path: ./uploads/clinico/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
