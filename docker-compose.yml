version: '3.8'

services:
  # 1. Database (SQL Server 2022)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sisvet-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrongPassword123!", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. Database Initializer (Safe import on first run)
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sisvet-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./SisVetDB.sql:/usr/config/SisVetDB.sql
    entrypoint: >
      bash -c "
      echo 'Verificando estado de SisVetDB...' &&
      RESULT=$$(/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P 'YourStrongPassword123!' -C -Q \"SET NOCOUNT ON; SELECT DB_ID('SisVetDB')\" -h -1 | tr -d '[:space:]') &&
      if [ \"$$RESULT\" = \"NULL\" ] || [ -z \"$$RESULT\" ]; then
        echo 'La base de datos SisVetDB no existe. Iniciando importacion...' &&
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P 'YourStrongPassword123!' -C -i /usr/config/SisVetDB.sql &&
        echo 'Importacion completada con exito.'
      else
        echo 'La base de datos SisVetDB ya existe. Omitiendo importacion para preservar los datos.'
      fi
      "

  # 3. Messaging Queue (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sisvet-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI dashboard (user: guest / pass: guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # 4. Backend (Spring Boot API)
  sisvet-backend:
    build:
      context: ./sisvet-backend
      dockerfile: Dockerfile
    container_name: sisvet-backend
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://db:1433;databaseName=SisVetDB;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=YourStrongPassword123!
      - SPRING_RABBITMQ_HOST=rabbitmq
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  # 5. Frontend (Angular + Nginx reverse proxy)
  sisvet-frontend:
    build:
      context: ./sisvetFront
      dockerfile: Dockerfile
    container_name: sisvet-frontend
    depends_on:
      - sisvet-backend
    ports:
      - "80:80"

volumes:
  sqlserver_data:
  rabbitmq_data:
  backend_uploads:
